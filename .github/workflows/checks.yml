name: Checks

on:
    push:
        branches: ["**"]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    static-checks:
        name: Static checks
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                shell: nix develop --no-update-lock-file .#ci --command bash --noprofile --norc -euo pipefail {0}
        env:
            UV_CACHE_DIR: ${{ github.workspace }}/tmp/uv-cache
        steps:
            - name: Check out repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install Nix
              uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
              with:
                  enable_kvm: false

            - name: Cache Nix dependencies
              uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
              with:
                  primary-key: nix-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'treefmt.toml', '.github/workflows/checks.yml') }}

            - name: Cache uv downloads
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ env.UV_CACHE_DIR }}
                  key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'uv.lock', 'pyproject.toml') }}

            - name: Install Python dependencies
              run: uv sync --frozen

            - name: Check formatting
              id: formatting
              run: treefmt --no-cache --fail-on-change

            - name: Show formatting diff
              if: ${{ failure() && steps.formatting.outcome == 'failure' }}
              run: |
                  git diff --stat
                  git diff --no-ext-diff --no-color

            - name: Lint Python
              run: ruff check src tests scripts

            - name: Check Python types
              run: uv run --frozen mypy src tests

            - name: Check Protobuf bindings
              run: uv run --frozen python scripts/generate_proto.py --check

            - name: Run headless core, Stage 1, and bus tests
              run: |
                  uv run --frozen python -m unittest -v \
                    tests/test_architecture.py \
                    tests/test_json_content.py \
                    tests/test_proto_framing.py \
                    tests/test_bus_codec.py \
                    tests/test_edge_process.py \
                    tests/test_center_process.py \
                    tests/test_detection.py \
                    tests/test_calibration.py \
                    tests/test_device_pipeline.py \
                    tests/test_device_rays.py \
                    tests/test_fusion_ingress.py \
                    tests/test_fusion_geometry.py \
                    tests/test_fusion_matching.py \
                    tests/test_fusion_motion.py \
                    tests/test_fusion_uncertainty.py \
                    tests/test_center_exhaustive.py \
                    tests/test_center_postintersection.py \
                    tests/test_voxel_diagnostics.py \
                    tests/test_reference_fusion.py \
                    tests/test_scorer_*.py \
                    tests/test_legacy_converter.py \
                    tests/test_device_evaluation.py \
                    tests/test_center_size_evaluation.py \
                    tests/test_difficulty_evaluation.py \
                    tests/test_integrated_attribution.py \
                    tests/test_dynamic_scoring.py \
                    tests/test_evaluation_preview.py \
                    tests/test_godot_viewer.py \
                    tests/test_godot_producer_unit.py \
                    tests/test_performance.py \
                    tests/test_distribution.py

            - name: Check Rust workspace
              if: ${{ hashFiles('Cargo.toml') != '' }}
              run: |
                  cargo fmt --all -- --check
                  cargo clippy --workspace --all-targets -- -D warnings
                  cargo test --workspace
