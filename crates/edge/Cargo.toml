[package]
name = "edge"
version = "0.1.0"
edition = "2021"
description = "Chongming standalone Edge CV process: FrameSource, detection/tracking, auxiliary calibration, and tangent-Gaussian ray generation"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "io-util", "process", "rt-multi-thread", "signal", "sync", "time"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"
