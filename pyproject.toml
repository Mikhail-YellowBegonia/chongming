[project]
name = "chongming"
version = "0.0.0"
description = "Architecture skeleton for a multi-camera airborne-target research system"
readme = "README.md"
license-files = ["COPYING"]
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=11,<13",
    "protobuf>=7.36.2,<8",
    "shapely>=2.1,<3",
    "zstandard>=0.23,<1",
]

[project.scripts]
chongming-preview = "chongming.preview:main"
chongming-scene = "chongming.scenarios.run:main"
chongming-center = "chongming.development:main"
chongming-edge = "chongming.bus.edge_process:main"
chongming-osm = "chongming.scenarios.osm:main"
chongming-scorer = "chongming_scorer.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "ruff>=0.8",
    "types-protobuf>=7.35,<8",
    "types-shapely>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/chongming/",
    "/src/chongming_proto/",
    "/src/chongming_scorer/",
    "/proto/",
    "/tests/",
    "/scripts/",
    "/scenarios/",
    "/docs/",
    "/README.md",
    "/AGENTS.md",
    "/.editorconfig",
    "/.gitignore",
    "/flake.nix",
    "/flake.lock",
    "/uv.lock",
    "/pyproject.toml",
    "/treefmt.toml",
    "/COPYING",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chongming", "src/chongming_proto", "src/chongming_scorer"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/*_pb2.py", "**/*_pb2.pyi"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chongming", "chongming_proto", "chongming_scorer"]
exclude = ["scripts/"]

[[tool.mypy.overrides]]
module = [
    "chongming_proto.v1.common_pb2",
    "chongming_proto.v1.online_pb2",
    "chongming_proto.v1.truth_pb2",
]
disallow_any_generics = false

[tool.uv]
exclude-newer = "3 days ago"
